<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="轻量、无需服务器、支持多端部署的个人导航页" />
  <meta name="theme-color" content="#0f172a" />
  <title>我的导航</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="bgLayer" aria-hidden="true"></div>

  <div class="container">
    <!-- 头部 -->
    <header class="header-area">
      <div class="header-text">
        <h1 id="pageTitle" title="我的导航">🧭 我的导航</h1>
        <p id="pageSubtitle">轻量 · 无服务器 · 多端部署</p>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="layoutToggleBtn" title="切换：分类瀑布流 / 单页标签" aria-label="切换布局">🗂️</button>
        <button class="icon-btn" id="densityToggleBtn" title="切换卡片密度" aria-label="切换卡片密度">📐</button>
        <button class="icon-btn" id="themeToggleBtn" title="切换主题" aria-label="切换主题">🌙</button>
      </div>
    </header>

    <!-- 问候语 / 时钟 -->
    <div class="greeting" id="greeting"></div>

    <!-- 搜索区域 -->
    <section class="search-wrapper">
      <div class="search-tabs" id="searchTabs" role="tablist" aria-label="搜索引擎分类"></div>
      <div class="search-box">
        <button class="engine-trigger" id="engineTrigger" aria-label="切换搜索引擎">
          <img id="searchEngineIcon" src="" alt="" />
          <span class="engine-name" id="engineName"></span>
          <span class="engine-arrow" id="engineArrow">▾</span>
        </button>
        <span class="search-divider"></span>
        <input
          type="text"
          id="searchInput"
          placeholder="搜索网页 / 输入关键词定位站内网站"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        />
        <button class="clear-btn" id="clearBtn" aria-label="清空" hidden>✕</button>
        <button class="search-submit-btn" id="searchSubmitBtn" aria-label="搜索">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </div>
      <div class="engine-list" id="enginePanel" hidden></div>
      <p class="search-hint" id="searchHint">输入关键词即时筛选站内网站（支持拼音），按 <kbd>Enter</kbd> 使用所选引擎搜索</p>
    </section>

    <!-- 分类标签（单页模式） -->
    <nav class="category-tabs-row" id="categoryTabsRow" hidden></nav>

    <!-- 站点内容 -->
    <main id="main-content"></main>

    <footer class="footer">
      <span id="footerText">数据配置：links.json · 全局设置：config.js</span>
    </footer>
  </div>

  <!-- 前台管理：登录/注册弹窗 -->
  <div id="authMask" class="modal-mask" hidden>
    <div class="modal">
      <h3 id="authTitle">🔐 登录</h3>
      <p class="modal-sub" id="authDesc"></p>
      <div id="authAlert"></div>
      <div class="field">
        <label>用户名</label>
        <input id="authUsername" autocomplete="username" />
      </div>
      <div class="field">
        <label>密码（至少 6 位）</label>
        <input id="authPassword" type="password" autocomplete="current-password" />
      </div>
      <div class="field" id="authConfirmField" hidden>
        <label>确认密码</label>
        <input id="authConfirm" type="password" autocomplete="new-password" />
      </div>
      <div class="modal-actions">
        <button id="authSwitchBtn" type="button">没有账号？去注册</button>
        <button class="primary-btn" id="authSubmitBtn" type="button">登录</button>
      </div>
    </div>
  </div>

  <!-- 前台管理：站点/分类编辑弹窗 -->
  <div id="editMask" class="modal-mask" hidden>
    <div class="modal">
      <h3 id="editTitle">编辑</h3>
      <div class="field">
        <label>标题 *</label>
        <input id="e_title" />
      </div>
      <div class="field">
        <label>网址 *（https://...）</label>
        <input id="e_url" placeholder="https://" />
      </div>
      <div class="field">
        <label>内网地址（可选）</label>
        <input id="e_intranet" placeholder="http://192.168.x.x:端口/" />
      </div>
      <div class="field">
        <label>简介</label>
        <input id="e_desc" />
      </div>
      <div class="field">
        <label>关键词（搜索用，空格分隔）</label>
        <input id="e_keywords" />
      </div>
      <div class="field">
        <label>自定义图标（可选）</label>
        <input id="e_icon" placeholder="留空则自动抓取 favicon" />
      </div>
      <div class="modal-actions">
        <button id="editCancelBtn" type="button">取消</button>
        <button class="primary-btn" id="editSaveBtn" type="button">保存</button>
      </div>
    </div>
  </div>

  <!-- 浮动按钮 -->
  <button class="float-btn login-btn" id="loginBtn" hidden>🔐 登录</button>
  <button class="float-btn edit-btn" id="editBtn" hidden>✏️ 编辑</button>
  <button class="float-btn net-toggle-btn" id="netToggleBtn" title="切换内外网" hidden>🌐 外网</button>
  <button class="float-btn back-top-btn" id="backTopBtn" title="回到顶部" hidden>↑</button>

  <script src="pinyin-pro.min.js"></script>
  <script src="config.js"></script>
  <script src="nav-admin.js"></script>
  <script src="main.js"></script>
</body>
</html>
